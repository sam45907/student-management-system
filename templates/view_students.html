<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
            padding:40px;
        }

        .container{
            max-width:1000px;
            margin:auto;
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#007bff;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f1f1f1;
        }

        .btn{
            text-decoration:none;
            padding:8px 14px;
            border-radius:5px;
            color:white;
            font-size:14px;
        }

        .edit{
            background:#28a745;
        }

        .delete{
            background:#dc3545;
        }

        .home-btn{
            display:inline-block;
            margin-top:20px;
            background:#007bff;
            color:white;
            padding:10px 18px;
            text-decoration:none;
            border-radius:5px;
        }

        .home-btn:hover{
            background:#0056b3;
        }

        .empty{
            text-align:center;
            padding:20px;
            color:#666;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Student Records</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>

        {% if students %}
            {% for s in students %}
            <tr>
                <td>{{ s[0] }}</td>
                <td>{{ s[1] }}</td>
                <td>{{ s[2] }}</td>
                <td>{{ s[3] }}</td>
                <td>{{ s[4] }}</td>

                <td>
                    <a href="/update/{{ s[0] }}" class="btn edit">Edit</a>
                    <a href="/delete/{{ s[0] }}" class="btn delete"
                       onclick="return confirm('Are you sure you want to delete this student?');">
                       Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        {% else %}
            <tr>
                <td colspan="6" class="empty">
                    No students found.
                </td>
            </tr>
        {% endif %}
    </table>

    <a href="/" class="home-btn">← Back to Home</a>

</div>

</body>
</html>
